services:
  postgres:
    image: postgres:18
    container_name: space-exploration-postgres
    environment:
      POSTGRES_DB: space_exploration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  app:
    image: space-exploration-api
    container_name: space-exploration-api
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NASA_API_KEY: ${NASA_API_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/space_exploration
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres-data: